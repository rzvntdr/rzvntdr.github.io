<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rzvntdr — apps</title>
<meta name="description" content="Apps by rzvntdr: SpiritLog, a calm meditation timer for Android.">
<style>
  :root { --bg: #f6f3ee; --ink: #23272b; --muted: #5d646b; --accent: #2f6f6a; --card: #ffffff; --line: #e3ddd3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14191d; --ink: #e6ebef; --muted: #a3adb5; --accent: #7cc4bc; --card: #1c2328; --line: #2b343b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 32px; }
  .app { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; }
  .app h2 { font-size: 21px; margin: 0 0 6px; }
  .app p { margin: 0 0 12px; }
  a { color: var(--accent); }
  ul { margin: 0; padding-left: 20px; }
</style>
</head>
<body>
<main>
  <h1>rzvntdr</h1>
  <p class="lead">Small, calm apps.</p>
  <section class="app">
    <h2>SpiritLog</h2>
    <p>A meditation timer for Android: presets with phases and gentle cues, a plant that grows with each day you sit, and backups to your own Google Drive.</p>
    <ul>
      <li><a href="https://rzvntdr.github.io/spiritlog-releases/privacy-policy">Privacy policy</a></li>
    </ul>
  </section>
